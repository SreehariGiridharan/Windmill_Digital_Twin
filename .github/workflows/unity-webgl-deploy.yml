name: Build and Deploy Unity WebGL

on:
  push:
    branches: [dev]  # change this to your working branch

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Unity
        uses: game-ci/unity-setup@v3
        with:
          unityVersion: 2022.3.10f1  # Replace with your Unity version

      - name: Build WebGL
        uses: game-ci/unity-builder@v3
        with:
          targetPlatform: WebGL

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/WebGL/WebGL  # or your actual build folder
